name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Wersja do wydania, np. v1.0.0 (tag zostanie założony)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testy
        run: |
          python -m pip install pytest pillow numpy tqdm
          python -m pytest -q

      - name: Budowanie paczki
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          ./packaging/build_windows.ps1

      - name: Paczka jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: FileSearcher-windows-x64
          path: dist/FileSearcher-windows-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/FileSearcher-windows-x64.zip
          generate_release_notes: true
